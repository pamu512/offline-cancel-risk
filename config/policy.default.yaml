dbscan:
  min_pts: 7
  confidence_threshold: 0.75
  clustering_radius_m: 50
  immediate_dp_radius: 150
  standard_dp_radius: 400
  extended_dp_radius: 800
  standard_discount: 0.6
  extended_discount: 0.2
  drop_off_min_pts: 30
  round_trip_gap_seconds: 3600
  # Scale min_pts / drop_off_min_pts from median ping gap vs autoscale_ref_gap_seconds.
  autoscale_min_pts: true
  autoscale_ref_gap_seconds: 5
dwell:
  min_dwell_seconds: 120
  max_speed_mps: 1.5
  # Tighter than sequence.stop_match_radius_m — reject approach-road / signal queues.
  radius_m: 80
  # Break dwell run if the track crawls farther than this from the run anchor (traffic).
  max_run_displacement_m: 40
  min_gap_samples: 3
  # Clamp median ping gap before autoscale (bursts / sparse batches).
  gap_seconds_min: 1
  gap_seconds_max: 30
  place_factors:
    unknown: 1.0
    curb: 0.85
    residential: 1.0
    apartment: 1.35
    commercial: 1.5
  vehicle_factors:
    unknown: 1.0
    walker: 0.55
    cycle: 0.6
    two_wheel: 0.7
    van_pickup: 1.0
    large_4w: 1.25
    box_truck: 1.45
    semi: 1.6
sequence:
  stop_match_radius_m: 150
  # Weight of sequence_score in cancelled_offline rule blend (vs stop/dwell).
  offline_weight: 1.5
  # When path is incomplete, require this fraction of middle stops between pickup→drop.
  min_middle_fraction: 1.0
gps:
  min_window_h: 3
  max_window_h: 24
  min_points: 20
  max_gap_minutes: 45
replacement:
  max_place_delay_minutes: 180
  route_similarity_min: 0.7
theft:
  high_value_amount: 500
  food_categories: ["FOOD", "FOOD_DELIVERY"]
  cancel_after_pickup_bonus: 0.2
  near_dropoff_no_order_bonus: 0.15
abuse:
  multi_cancel_window_minutes: 120
  near_dest_radius_m: 400
  # Cross-order cancel/reassign chain lookback for driver_chain_count.
  chain_lookback_minutes: 120
  cancel_stats_window_minutes: 120
  cancel_after_pickup_bonus: 0.2
  no_progress_bonus: 0.2
  wrong_direction_bonus: 0.25
  cancel_rate_min_count: 4
  cancel_rate_threshold: 2.0
  cancel_rate_bonus: 0.15
  # Marketplace funnel (slice 1) — ratios beat cancels/hour for abuse.
  marketplace_min_support: 5
  accept_cancel_rate_threshold: 0.45
  accept_cancel_rate_bonus: 0.25
  completion_rate_floor: 0.40
  low_completion_rate_bonus: 0.20
  with_cause_fraction_floor: 0.35
  without_cause_bonus: 0.20
  pair_cancel_min: 3
  pair_density_bonus: 0.2
  multi_account_device_bonus: 0.25
  multi_user_device_bonus: 0.20
  device_hopping_bonus: 0.20
  shared_device_pair_bonus: 0.25
device_integrity:
  ewma_alpha: 0.4
  risk_threshold: 0.7
  abuse_bonus_scale: 0.35
  gps_dampen: 0.5
device_graph:
  window_days: 30
  min_support: 3
  max_drivers_per_device: 3
  max_users_per_device: 3
  max_devices_per_driver: 4
  shared_pair_min_sightings: 1
chat_signals:
  risk_threshold: 0.55
  abuse_bonus_scale: 0.40
  stall_combo_bonus: 0.15
  repeat_min_count: 3
  repeat_bonus: 0.20
  window_minutes: 10080  # 7d
anomaly:
  # apply: abuse_bonus live (anomaly is abuse-only). Theft untouched.
  mode: apply  # shadow | apply | off
  window_n: 20
  peer_window_n: 200
  min_support: 8
  z_threshold: 3.0
  epsilon: 0.001
  abuse_bonus: 0.15
  features: [accept_cancel_rate, cancel_rate, cancel_abuse]
stages:
  merchant_radius_m: 150
  dropoff_radius_m: 400
progress:
  window_minutes: 8
  max_heading_error_deg: 60
  away_heading_error_deg: 120
  min_points: 3
  no_progress_ratio: 0.15
  min_start_distance_m: 200
gps_integrity:
  max_speed_mps: 55
  teleport_jump_m: 2000
  stop_confidence_dampen: 0.5
blend:
  # When ml_scores are null, blend falls back to rules only.
  cancelled_offline: {rule_weight: 0.6, ml_weight: 0.4}
  cancel_abuse: {rule_weight: 0.6, ml_weight: 0.4}
  selective_theft: {rule_weight: 0.6, ml_weight: 0.4}
thresholds:
  cancelled_offline: 0.75
  cancel_abuse: 0.75
  selective_theft: 0.75
ear:
  mode: shadow
  outcome_ewma_alpha: 0.05
  min_updates_apply: 5
  recoverability:
    cancelled_offline: 1.0
    cancel_abuse: 0.4
    selective_theft: 0.8
  attention_weights:
    cancelled_offline: 1.0
    cancel_abuse: 0.7
    selective_theft: 1.2
feedback:
  daily_review_quota: 50
  inline_soft_cap_fraction: 0.6
  # Ops SLO: aim for ≥ per_head_min labeled tickets closed per head per UTC day.
  per_head_min: 5
  per_head_max: 25
  uncertainty_delta: 0.1
# Entity baselines: FP dampener; apply for offline/abuse, theft stays shadow.
baselines:
  mode: apply
  window_n: 20
  pair_window_n: 8
  under_fraction: 0.9
  ewma_alpha: 0.2
  ewma_delta: 0.05
  min_ewma_samples: 10
  above_epsilon: 0.1
  above_fraction: 0.9
  discount: 0.85
  refresh_epsilon: 0.05
  max_age_days: 90
  heads:
    cancelled_offline:
      enabled: true
    cancel_abuse:
      enabled: true
      discount: 0.90
    selective_theft:
      enabled: true
      mode: shadow
# Precision-first learning on common behavioral patterns (~98% mass).
learning:
  target_precision: 0.98
  min_pattern_support: 15
  min_pattern_recall: 0.35
  pattern_mass_fraction: 0.7
  blend_search_min_support: 40
  pattern_strata:
    cancelled_offline:
      score_min: 0.85
    cancel_abuse:
      score_min: 0.70
    selective_theft:
      score_min: 0.70
# Market retune of v5 DBSCAN eps + min_pts (default shadow; apply auto-writes).
dbscan_retune:
  mode: shadow
  on_tick: false
  cooldown_minutes: 1440
  min_labeled: 15
  min_recall_lift: 0.01
  cache_retention_days: 30
  holdout_fraction: 0.3
  grid:
    clustering_radius_m: [30, 40, 50, 60, 80]
    min_pts: [5, 7, 9, 11, 15]
# Score calibration on pattern cohort S (default shadow; apply replaces scores).
calibration:
  mode: shadow
  on_tick: false
  min_labeled: 30
  platt_max_n: 80
  holdout_fraction: 0.3
  max_ece: 0.05
  max_brier: 0.25
  cooldown_minutes: 1440
  ece_bins: 10
  ece_strategy: quantile  # equal|quantile — quantile avoids fake-low ECE on clustered probs
routing:
  # Prioritized review routing from attention_score + flags (downstream may use queue).
  p1_attention_min: 200
  p2_attention_min: 50
  # Prefer theft queue when selective_theft flag is on; else offline; else abuse; else mixed.
  prefer_flag_order: ["selective_theft", "cancelled_offline", "cancel_abuse"]
